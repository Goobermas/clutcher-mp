<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clutcher MP — Network Test</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 960px; margin: 30px auto; padding: 0 18px; background: #10151f; color: #eef2ff; }
    .bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    button, input { border: 1px solid #475569; padding: 9px 12px; border-radius: 7px; color: inherit; background: #1f2937; }
    button { cursor: pointer; } button:hover { background: #334155; }
    canvas { display: block; width: 100%; border: 1px solid #475569; border-radius: 8px; background: #172232; }
    #status, #events { color: #b5c3da; } #events { font: 12px monospace; max-height: 130px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Clutcher MP — v0.3</h1>
  <p>Open this page in two tabs, join the same room, and move using WASD. This is a networking test, not the game client.</p>
  <div class="bar">
    <button id="connect">Connect</button>
    <input id="room" value="lobby" maxlength="32" aria-label="Room name">
    <button id="join">Join room</button>
    <button id="disconnect">Disconnect</button>
    <button id="ready">Ready: OFF</button>
    <span id="status">Disconnected</span>
  </div>
  <p><strong id="score">CT 0 - 0 T</strong> · <span id="clock">10:00</span> · <span id="phase">Waiting for players</span></p>
  <canvas id="world" width="920" height="510"></canvas>
  <p>Player: <code id="playerId">—</code> | Room: <code id="roomId">—</code> | Ping: <span id="latency">—</span> ms</p>
  <div id="events" aria-live="polite"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const ctx = $("world").getContext("2d");
    const held = new Set();
    let socket = null, myId = null, roomId = null, players = [];
    let ready = false, clockDeadline = 0, match = null;

    function log(message) {
      const line = document.createElement("div");
      line.textContent = message;
      $("events").prepend(line);
      while ($("events").children.length > 30) $("events").lastChild.remove();
    }
    function online() { return socket?.readyState === WebSocket.OPEN; }
    function send(message) { if (online()) socket.send(JSON.stringify(message)); }

    $("connect").onclick = () => {
      if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(`${protocol}//${location.host}/ws`);
      $("status").textContent = "Connecting...";
      socket.onopen = () => { $("status").textContent = "Connected"; log("Connected"); };
      socket.onerror = () => log("Connection error");
      socket.onclose = () => {
        $("status").textContent = "Disconnected";
        myId = null; roomId = null; players = []; held.clear();
        ready = false; match = null; $("ready").textContent = "Ready: OFF";
        $("playerId").textContent = "—";
        $("roomId").textContent = "—";
        $("latency").textContent = "—";
        log("Disconnected");
      };
      socket.onmessage = (event) => {
        let message;
        try { message = JSON.parse(event.data); } catch { return; }
        if (message.type === "welcome") {
          myId = message.id;
          $("playerId").textContent = myId.slice(0, 8);
          log("Welcome · protocol " + message.protocol_version);
        } else if (message.type === "joined") {
          roomId = message.room;
          players = [];
          ready = false;
          $("ready").textContent = "Ready: OFF";
          $("roomId").textContent = roomId;
          log("Joined room " + roomId);
        } else if (message.type === "match_state" && message.room === roomId) {
          match = message;
          clockDeadline = performance.now() + message.remainingMs;
          $("score").textContent = "CT " + message.score.CT + " - " + message.score.T + " T";
          $("phase").textContent = message.phase + " / round " + message.round;
        } else if (message.type === "snapshot") {
          if (message.room === roomId) players = message.players;
        } else if (message.type === "pong") {
          $("latency").textContent = Math.max(0, Date.now() - message.nonce);
        } else if (message.type === "error") {
          log("Server: " + message.message);
        }
      };
    };
    $("join").onclick = () => send({ type: "join_room", room: $("room").value });
    $("disconnect").onclick = () => { if (socket) socket.close(); };
    $("ready").onclick = () => {
      if (!online() || !roomId) return;
      ready = !ready;
      send({ type: "ready", ready });
      $("ready").textContent = "Ready: " + (ready ? "ON" : "OFF");
    };
    setInterval(() => {
      if (!match) return;
      const remaining = match.phase === "waiting" ? match.roundSeconds :
        Math.max(0, (clockDeadline - performance.now()) / 1000);
      const total = Math.ceil(remaining);
      $("clock").textContent = Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
    }, 100);

    window.addEventListener("keydown", (event) => {
      if (event.target.tagName === "INPUT") return;
      const key = event.key.toLowerCase();
      if (["w", "a", "s", "d"].includes(key)) { held.add(key); event.preventDefault(); }
    });
    window.addEventListener("keyup", (event) => held.delete(event.key.toLowerCase()));
    window.addEventListener("blur", () => held.clear());

    setInterval(() => {
      if (!online() || !roomId) return;
      send({
        type: "input",
        x: Number(held.has("d")) - Number(held.has("a")),
        y: Number(held.has("s")) - Number(held.has("w"))
      });
    }, 50);

    setInterval(() => { if (online()) send({ type: "ping", nonce: Date.now() }); }, 2000);

    function draw() {
      const canvas = $("world");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#29384e";
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
      ctx.font = "14px system-ui";
      for (const player of players) {
        const x = canvas.width / 2 + player.x, y = canvas.height / 2 + player.y;
        const self = player.id === myId;
        ctx.fillStyle = self ? "#38bdf8" : "#fbbf24";
        ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#e2e8f0";
        ctx.fillText(self ? "You" : player.id.slice(0, 8), x - 15, y - 19);
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
